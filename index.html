<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CheckAll</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#081012;--p:#0f1b1e;--p2:#142428;--ln:#1f3438;--tx:#e8f0ee;--mu:#82999b;--ac:#ffb454;--cy:#6cc6ff;--ok:#4fd1a1;--wa:#f2c14e;--bd:#ff6b6b;--on:#1b1204;--glow:rgba(255,180,84,.12);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f1eee6;--p:#fff;--p2:#f7f4ec;--ln:#ddd6c6;--tx:#1b2426;--mu:#5c6d6d;--ac:#b4570a;--cy:#16679a;--ok:#14805a;--wa:#8f6400;--bd:#c62f2f;--on:#fff;--glow:rgba(180,87,10,.08)}}
:root[data-theme="dark"]{--bg:#081012;--p:#0f1b1e;--p2:#142428;--ln:#1f3438;--tx:#e8f0ee;--mu:#82999b;--ac:#ffb454;--cy:#6cc6ff;--ok:#4fd1a1;--wa:#f2c14e;--bd:#ff6b6b;--on:#1b1204;--glow:rgba(255,180,84,.12)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Bricolage Grotesque',system-ui,sans-serif;line-height:1.45}
.w{max-width:1120px;margin:0 auto;padding:0 18px}
nav{display:flex;align-items:center;gap:22px;padding:16px 0;border-bottom:1px solid var(--ln)}
nav b{font-size:20px;font-weight:800;letter-spacing:-.02em;margin-right:auto}nav a{color:var(--mu);font-size:14px;text-decoration:none}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;padding:44px 0 30px}
h1{font-size:clamp(34px,5vw,58px);line-height:1.02;margin:0 0 12px;font-weight:800;letter-spacing:-.03em}
.sub{color:var(--mu);margin:0 0 22px;max-width:46ch}
.box{background:var(--p);border:1px solid var(--ln);border-radius:16px;padding:16px;box-shadow:0 0 60px var(--glow)}
label{display:block;font-size:13px;color:var(--mu);margin:0 0 6px}
.row{display:flex;gap:8px;margin-bottom:14px}.row:last-child{margin:0}
input{flex:1;min-width:0;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:12px;font:inherit;font-size:15px}
button{background:var(--ac);color:var(--on);border:0;border-radius:10px;padding:12px 16px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
button.g{background:none;color:var(--ac);border:1px solid var(--ln)}
input:focus-visible,button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.radar{width:100%;max-width:380px;margin:auto;display:block}
.sweep{transform-origin:150px 150px;animation:sw 6s linear infinite}@keyframes sw{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.sweep{animation:none}}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--ln);margin:10px 0 18px;overflow-x:auto}
.tabs button{background:none;color:var(--mu);border-radius:0;border-bottom:2px solid transparent;padding:12px 14px;font-weight:600}
.tabs button[aria-selected=true]{color:var(--tx);border-color:var(--ac)}
.g2{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.c{background:var(--p);border:1px solid var(--ln);border-radius:14px;padding:16px;margin-bottom:14px;min-width:0}
h2{font-size:15px;margin:0 0 12px;font-weight:600}.k{font-size:12px;color:var(--mu)}.v{font-size:20px;font-weight:600}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--mu);word-break:break-all}
.st{background:var(--p2);border-radius:10px;padding:12px}
.big{font-size:38px;font-weight:800;letter-spacing:-.02em}
.tag{font-size:11px;border:1px solid currentColor;border-radius:99px;padding:1px 8px;white-space:nowrap;display:inline-block}
.bd{color:var(--bd)}.wa{color:var(--wa)}.ok{color:var(--ok)}.cy{color:var(--cy)}
.cat{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:14px}.cat span:first-child{width:128px}.cat span:last-child{width:28px;text-align:right}
.bar{height:8px;background:var(--bg);border-radius:6px;overflow:hidden;flex:1}.bar i{display:block;height:100%}
.fl{display:flex;gap:10px;margin:9px 0;font-size:14px}.fl em{font-style:normal;font-weight:800;width:16px;flex:none}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:8px 6px;border-bottom:1px solid var(--ln);text-align:left}th{color:var(--mu);font-weight:400}
.sc{overflow-x:auto}.pills{display:flex;gap:6px}.pills span{font-size:12px;padding:3px 10px;border:1px solid var(--ln);border-radius:99px;color:var(--mu)}.pills .on{color:var(--on);background:var(--ac);border-color:var(--ac)}
.tl{border-left:2px solid var(--ln);margin-left:6px;padding-left:16px}.tl div{margin:0 0 14px;font-size:14px;position:relative}.tl div:before{content:"";position:absolute;left:-23px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--ac)}.tl .x:before{background:var(--bd)}
.av{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--bd));display:grid;place-items:center;font-weight:800;font-size:22px;color:var(--on)}
[hidden]{display:none}.note{font-size:12px;color:var(--mu);padding:18px 0 40px}
svg text{fill:var(--mu);font-family:inherit}
@media (max-width:820px){.hero,.g2,.g3{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr}.radar{max-width:240px}nav a{display:none}}
</style></head><body><div class="w">
<nav><b>CheckAll</b><a href="#">Scan</a><a href="#">Wallets</a><a href="#">Trending</a><a href="#">Watchlist</a></nav>
<section class="hero"><div>
<h1>Know who is behind a coin before you buy it.</h1>
<p class="sub">Enter a token address and a Twitter profile. Liquidity, bundled wallets, deployer history, account age and name changes in one panel.</p>
<div class="box"><label for="ca">Token address</label><div class="row"><input id="ca" placeholder="Token contract address" autocomplete="off"><button id="b1">Analyze token</button></div>
<label for="tw">Twitter profile</label><div class="row"><input id="tw" placeholder="@username or profile link" autocomplete="off"><button id="b2">Check account</button></div></div></div>
<svg class="radar" viewBox="0 0 300 300" aria-hidden="true"><defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffb454" stop-opacity="0"/><stop offset="1" stop-color="#ffb454" stop-opacity=".5"/></linearGradient></defs>
<g fill="none" stroke="var(--ln)"><circle cx="150" cy="150" r="140"/><circle cx="150" cy="150" r="95"/><circle cx="150" cy="150" r="48"/><path d="M150 10V290M10 150H290"/></g>
<path class="sweep" d="M150 150L150 10A140 140 0 0 1 249 51Z" fill="url(#sg)"/>
<circle cx="205" cy="82" r="6" fill="var(--bd)"/><circle cx="96" cy="196" r="5" fill="var(--ok)"/><circle cx="212" cy="212" r="5" fill="var(--wa)"/><circle cx="118" cy="104" r="4" fill="var(--bd)"/><circle cx="150" cy="150" r="4" fill="var(--ac)"/></svg>
</section>

<div class="tabs" role="tablist" id="tabs"></div>
<div id="out"></div>
<p class="note">Live data from DexScreener and Solana RPC. Not financial advice.</p>
</div>
<script>
var $=function(i){return document.getElementById(i)};
function col(n){return n>=70?'var(--ok)':n>=45?'var(--wa)':'var(--bd)'}
function ic(t){return t=='x'?'<em class="bd">✕</em>':t=='!'?'<em class="wa">!</em>':'<em class="ok">✓</em>'}
function flags(a){return a.map(function(f){return '<div class="fl">'+ic(f[0])+'<span>'+f[1]+'</span></div>'}).join('')}
function st(a,b){return '<div class="st"><div class="k">'+a+'</div><div class="v">'+b+'</div></div>'}
function gauge(n){var L=282.7;return '<svg viewBox="0 0 220 125" width="100%" style="max-width:260px;display:block;margin:auto"><path d="M20 110A90 90 0 0 1 200 110" fill="none" stroke="var(--ln)" stroke-width="14" stroke-linecap="round"/><path d="M20 110A90 90 0 0 1 200 110" fill="none" stroke="'+col(100-n+20)+'" stroke-width="14" stroke-linecap="round" stroke-dasharray="'+L+'" stroke-dashoffset="'+(L*(1-n/100))+'"/><text x="110" y="100" text-anchor="middle" style="font-size:42px;font-weight:800;fill:var(--tx)">'+n+'</text><text x="110" y="120" text-anchor="middle" style="font-size:11px">risk / 100</text></svg>'}

var D=null,cur=0,busy=false;
function fmt(n){n=+n;if(!isFinite(n))return '—';if(n>=1e9)return '$'+(n/1e9).toFixed(2)+'B';if(n>=1e6)return '$'+(n/1e6).toFixed(2)+'M';if(n>=1e3)return '$'+(n/1e3).toFixed(1)+'K';return '$'+n.toFixed(2)}
function age(ms){var m=Math.round((Date.now()-ms)/60000);return m<60?m+' min':m<2880?Math.round(m/60)+' h':Math.round(m/1440)+' days'}
function chg(v){return v==null?'—':'<span class="'+(v>=0?'ok':'bd')+'">'+(v>=0?'▲ ':'▼ ')+Math.abs(v).toFixed(2)+'%</span>'}
function sh(a){return a.slice(0,4)+'…'+a.slice(-4)}
function analyze(d){var f=[],c=[];
var cx=null;if(d.mintRenounced!==null){cx=(d.mintRenounced?50:0)+(d.freezeRenounced?50:0);f.push([d.mintRenounced?'v':'x','Mint authority is '+(d.mintRenounced?'renounced':'NOT renounced: supply can be inflated')]);f.push([d.freezeRenounced?'v':'x','Freeze authority is '+(d.freezeRenounced?'renounced':'NOT renounced: wallets can be frozen')])}
c.push(['Contract / token',cx]);
var l=d.liq||0,ls=l<5e3?15:l<2e4?30:l<5e4?55:l<15e4?75:90;c.push(['Liquidity safety',ls]);
f.push([l<2e4?'x':l<5e4?'!':'v','Liquidity is '+fmt(l)+(l<2e4?': thin, large trades will move the price':'')]);
var hd=null,wc=null;if(d.holders){var np=d.holders.filter(function(h){return !h.pool}),t10=np.slice(0,10).reduce(function(a,h){return a+h.pct},0),mx=np.length?np[0].pct:0;d.t10=t10;
hd=t10<20?90:t10<30?70:t10<45?50:25;wc=mx<3?90:mx<6?70:mx<10?50:25;
f.push([t10>=30?'x':t10>=20?'!':'v','Top 10 wallets hold '+t10.toFixed(1)+'% of supply (pools excluded)']);f.push([mx>=10?'x':mx>=5?'!':'v','Largest wallet holds '+mx.toFixed(1)+'%'])}
c.push(['Holder distribution',hd]);c.push(['Wallet concentration',wc]);c.push(['Bundle / sniper',null]);c.push(['Deployer',null]);
var th=null;if(d.buys!=null){var r=d.buys/Math.max(1,d.sells);th=(r>=.7&&r<=1.4)?75:55;var m=(Date.now()-d.created)/60000;if(m<60){th-=20;f.push(['x','Trading pair is only '+Math.round(m)+' minutes old'])}else if(m<1440)f.push(['!','Trading pair is less than a day old']);f.push(['v','Buys / sells in 24h: '+d.buys+' / '+d.sells])}
c.push(['Trading health',th]);
var v=c.filter(function(x){return x[1]!==null}),s=Math.round(v.reduce(function(a,x){return a+x[1]},0)/v.length);
f.sort(function(a,b){return 'x!v'.indexOf(a[0])-'x!v'.indexOf(b[0])});
return {score:100-s,safety:s,cats:c,flags:f}}
function hbars(h){var mx=h[0]?Math.max.apply(null,h.map(function(x){return x.pct})):1;return '<svg viewBox="0 0 480 150" width="100%">'+h.map(function(x,i){var ht=Math.max(2,x.pct/mx*120);return '<rect x="'+(i*24+4)+'" y="'+(130-ht)+'" width="18" height="'+ht+'" rx="3" fill="'+(x.pool?'var(--mu)':'var(--cy)')+'"/><text x="'+(i*24+13)+'" y="146" text-anchor="middle" style="font-size:8px">'+(i+1)+'</text>'}).join('')+'</svg>'}
function soon(t){return '<div class="c"><h2>'+t+'</h2><p class="k" style="max-width:60ch">This module is coming in the next step.</p></div>'}
function tOverview(){var d=D,a=analyze(d),vl=a.score;d.a=a;
var sc=d.socials.map(function(s){return '<a class="tag cy" href="'+s.url+'" target="_blank" rel="noopener">'+s.type+'</a>'}).join(' ');
return '<div class="g2"><div class="c"><div class="k">'+d.dex+' · '+d.pairs+' pair(s)</div><div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap"><span class="v">'+d.name+' ('+d.symbol+')</span> '+sc+'</div><div class="big" style="margin:6px 0">$'+d.price+'</div><div class="mono">'+d.ca+'</div>'+
'<table style="margin-top:14px"><tr><th></th><th>5m</th><th>1h</th><th>6h</th><th>24h</th></tr><tr><td>Price</td><td>'+chg(d.chg.m5)+'</td><td>'+chg(d.chg.h1)+'</td><td>'+chg(d.chg.h6)+'</td><td>'+chg(d.chg.h24)+'</td></tr><tr><td>Volume</td><td>'+fmt(d.vol.m5)+'</td><td>'+fmt(d.vol.h1)+'</td><td>'+fmt(d.vol.h6)+'</td><td>'+fmt(d.vol.h24)+'</td></tr></table></div>'+
'<div class="c"><h2>Risk score</h2>'+gauge(vl)+'<p style="text-align:center;margin:4px 0 0;font-weight:600;color:'+col(a.safety)+'">'+(a.safety>=70?'Lower risk':a.safety>=45?'Medium risk':'High risk')+'</p><p class="k" style="text-align:center">Based on available data only. Missing categories are left out, never guessed.</p></div></div>'+
'<div class="g4" style="margin-bottom:14px">'+st('Market cap',fmt(d.mcap))+st('FDV',fmt(d.fdv))+st('Liquidity',fmt(d.liq))+st('Volume 24h',fmt(d.vol.h24))+st('Pair age',age(d.created))+st('Buys / sells',d.buys+' / '+d.sells)+st('Top 10 holders',d.t10!=null?d.t10.toFixed(1)+'%':'—')+st('Token program',d.token2022===null?'—':d.token2022?'Token-2022':'SPL Token')+'</div>'+
'<div class="g2"><div class="c"><h2>Why this score</h2>'+flags(a.flags)+'</div><div class="c"><h2>Category scores</h2>'+a.cats.map(function(c){return '<div class="cat"><span>'+c[0]+'</span><span class="bar"><i style="width:'+(c[1]||0)+'%;background:'+col(c[1]||0)+'"></i></span><span>'+(c[1]===null?'n/a':c[1])+'</span></div>'}).join('')+'</div></div>'}
function tHolders(){var h=D.holders;if(!h)return '<div class="c"><h2>Top holders</h2><p class="k">Holder data is unavailable'+(D.holdersError?': '+D.holdersError:'. Check that HELIUS_API_KEY is set in Vercel.')+'</p></div>';
return '<div class="c"><h2>Top 20 holders (grey: program-controlled, likely pool)</h2>'+hbars(h)+'<div class="sc"><table><tr><th>#</th><th>Wallet</th><th>Balance</th><th>Supply</th><th>Tag</th></tr>'+h.map(function(x,i){return '<tr><td>'+(i+1)+'</td><td class="mono"><a href="https://solscan.io/account/'+x.owner+'" target="_blank" rel="noopener" style="color:inherit">'+sh(x.owner)+'</a></td><td>'+x.amount.toLocaleString('en-US',{maximumFractionDigits:0})+'</td><td>'+x.pct.toFixed(2)+'%</td><td>'+(x.pool?'<span class="tag">Pool / program</span>':'')+'</td></tr>'}).join('')+'</table></div></div>'}
var T=[['Overview',tOverview],['Holders',tHolders],['Twitter',function(){return soon('Twitter profile check')}],['Early buyers & deployer',function(){return soon('Early buyers and deployer history')}]];
function render(){$('tabs').innerHTML=D?T.map(function(t,i){return '<button role="tab" aria-selected="'+(i==cur)+'" data-i="'+i+'">'+t[0]+'</button>'}).join(''):'';
$('out').innerHTML=D?T[cur][1]():'<div class="c"><p class="k">Paste a Solana token address above and press Analyze token.</p></div>';
document.querySelectorAll('#tabs button').forEach(function(b){b.onclick=function(){cur=+b.dataset.i;render()}})}
$('b1').onclick=function(){var v=$('ca').value.trim();if(!v){$('ca').focus();return}if(busy)return;busy=true;$('b1').textContent='Loading…';
fetch('/api/token?ca='+encodeURIComponent(v)).then(function(r){return r.json()}).then(function(j){if(j.error){D=null;render();$('out').innerHTML='<div class="c bd">'+j.error+'</div>'}else{D=j;cur=0;render()}$('tabs').scrollIntoView({behavior:'smooth'})}).catch(function(){D=null;render();$('out').innerHTML='<div class="c bd">Could not reach the server. Try again.</div>'}).then(function(){busy=false;$('b1').textContent='Analyze token'})};
$('b2').onclick=function(){if(!$('tw').value.trim()){$('tw').focus();return}if(!D){$('out').innerHTML=soon('Twitter profile check');return}cur=2;render()};
render();
</script></body></html>
